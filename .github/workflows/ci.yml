name: Wharfie CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  remote-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: setup exact native Linux proof Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: install pinned npm
        working-directory: ${{ runner.temp }}
        run: npm install --global --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "$(node --print "require('${GITHUB_WORKSPACE}/package.json').packageManager")"
      - run: npm ci
      - name: prepare disposable SSH and systemd accounts
        id: provision
        run: bash scripts/prepare-remote-recovery-github-linux.sh
      - name: prove packaged remote recovery on native x64 Linux
        id: proof
        env:
          WHARFIE_SYSTEMD_PROOF_DISPOSABLE: github-actions
          WHARFIE_SYSTEMD_PROOF_COMMIT: ${{ github.sha }}
        run: node scripts/verify-single-node-remote-recovery-linux.js "$GITHUB_WORKSPACE"
      - name: collect only bounded proof receipts
        if: ${{ always() }}
        env:
          PROVISION_OUTCOME: ${{ steps.provision.outcome }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const output = path.join(process.env.RUNNER_TEMP, 'wharfie-remote-recovery-receipts');
          fs.mkdirSync(output, { mode: 0o700 });
          fs.writeFileSync(path.join(output, 'ci-outcome.json'), JSON.stringify({
            schemaVersion: 1,
            sourceCommit: process.env.GITHUB_SHA,
            architecture: process.arch,
            provisioning: process.env.PROVISION_OUTCOME,
            proof: process.env.PROOF_OUTCOME,
            providerAuthority: 'synthetic-no-provider-calls',
            machineCleanup: 'github-hosted-runner-disposal',
          }) + '\n', { mode: 0o600, flag: 'wx' });
          for (const name of ['remote-recovery-prepare.json', 'remote-recovery-final.json', 'remote-recovery-failure.json']) {
            const input = path.join('/var/tmp/wharfie-systemd-proof', name);
            const info = fs.lstatSync(input, { throwIfNoEntry: false });
            if (!info) continue;
            if (!info.isFile() || info.isSymbolicLink() || info.size > 256 * 1024 || info.uid !== process.getuid()) {
              throw new Error('Refusing an invalid bounded proof receipt: ' + name);
            }
            fs.copyFileSync(input, path.join(output, name), fs.constants.COPYFILE_EXCL);
          }
          NODE
      - name: retain native Linux proof receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wharfie-native-remote-recovery
          path: ${{ runner.temp }}/wharfie-remote-recovery-receipts/*.json
          if-no-files-found: warn
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: install pinned npm
        # setup-node's npm cache probe runs before this step. The Node
        # distribution's bundled npm is intentionally rejected by the exact
        # devEngines pin, so bootstrap from outside the repository first.
        working-directory: ${{ runner.temp }}
        run: npm install --global --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "$(node --print "require('${GITHUB_WORKSPACE}/package.json').packageManager")"
      - run: npm ci
      - run: npm run test:ci
      - name: verify preview release contract
        run: npm run verify:release:preview
      - name: verify packed install and real Linux SEA
        # Keep portability evidence visible when another validation gate fails.
        if: ${{ always() }}
        run: npm run verify:package:sea

  replacement-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: install pinned npm
        working-directory: ${{ runner.temp }}
        run: npm install --global --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "$(node --print "require('${GITHUB_WORKSPACE}/package.json').packageManager")"
      - run: npm ci
      - name: run replacement recovery regression lane
        run: npm run test:replacement-input
      - name: check process-death suites for open handles
        run: npm run test:replacement-process-death

  magnetic-first-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: install pinned npm
        working-directory: ${{ runner.temp }}
        run: npm install --global --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "$(node --print "require('${GITHUB_WORKSPACE}/package.json').packageManager")"
      - run: npm ci
      - name: verify copied starter against packed Wharfie
        run: npm run verify:magnetic-first-run

  preview-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: setup exact candidate-pack Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: install pinned pack-only npm
        working-directory: ${{ runner.temp }}
        run: npm install --global --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "$(node --print "require('${GITHUB_WORKSPACE}/package.json').packageManager")"
      - name: pack candidate without a root dependency install
        run: |
          mkdir -p "$RUNNER_TEMP/wharfie-preview-candidate"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/wharfie-preview-candidate"
      - name: pack AWS companion handoff without a root dependency install
        working-directory: packages/aws
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/wharfie-preview-candidate"
      - name: retain clean npm candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wharfie-preview-npm-candidate
          path: ${{ runner.temp }}/wharfie-preview-candidate/*.tgz
          if-no-files-found: error
          retention-days: 1

  preview-self-host:
    needs: preview-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: setup exact preview build Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: install pinned contributor npm
        working-directory: ${{ runner.temp }}
        run: npm install --global --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "$(node --print "require('${GITHUB_WORKSPACE}/package.json').packageManager")"
      - run: npm ci
      - name: download clean npm candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wharfie-preview-npm-candidate
          path: ${{ runner.temp }}/wharfie-preview-candidate
      - name: build and smoke-test the clean-installed Wharfie SEA
        run: >-
          npm run build:release:preview --
          --tag "v$(node --print "require('./package.json').version")"
          --output-dir "$RUNNER_TEMP/wharfie-preview-release"
      - name: verify the release used the no-root-install candidate bytes
        run: |
          version="$(node --print "require('./package.json').version")"
          cmp \
            "$RUNNER_TEMP/wharfie-preview-candidate/wharfie-wharfie-${version}.tgz" \
            "$RUNNER_TEMP/wharfie-preview-release/wharfie-wharfie-${version}.tgz"
          cmp \
            "$RUNNER_TEMP/wharfie-preview-candidate/wharfie-aws-${version}.tgz" \
            "$RUNNER_TEMP/wharfie-preview-release/wharfie-aws-${version}.tgz"
      - name: retain the exact recipient candidate assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wharfie-preview-recipient-candidate
          path: ${{ runner.temp }}/wharfie-preview-release/
          if-no-files-found: error
          retention-days: 1

  preview-recipient:
    needs: preview-self-host
    runs-on: ubuntu-latest
    # Keep setup, final diagnostics and account cleanup outside the helper caps.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: setup exact recipient builder Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: install pinned controller npm
        working-directory: ${{ runner.temp }}
        run: npm install --global --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "$(node --print "require('${GITHUB_WORKSPACE}/package.json').packageManager")"
      - run: npm ci
      - name: download the exact recipient candidate assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wharfie-preview-recipient-candidate
          path: ${{ runner.temp }}/wharfie-preview-recipient-candidate
      - name: prepare the isolated recipient account
        run: bash scripts/prepare-preview-recipient-github-linux.sh
      - name: prove candidate packaging and persistent recipient execution
        env:
          WHARFIE_PREVIEW_RECIPIENT_DISPOSABLE: github-actions
        run: >-
          node ./scripts/verify-preview-recipient.js
          --artifact-dir "$RUNNER_TEMP/wharfie-preview-recipient-candidate"
          --expected-commit "$GITHUB_SHA"
          --report "$RUNNER_TEMP/wharfie-preview-recipient.json"
      - name: remove and independently verify the owned recipient account
        if: ${{ always() }}
        run: >-
          bash scripts/prepare-preview-recipient-github-linux.sh
          --cleanup "$RUNNER_TEMP/wharfie-recipient-account-cleanup.json"
      - name: retain the bounded recipient proof
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wharfie-preview-recipient-proof
          path: |
            ${{ runner.temp }}/wharfie-preview-recipient.json
            ${{ runner.temp }}/wharfie-recipient-account-cleanup.json
          if-no-files-found: warn
          retention-days: 7

  preview-consumer:
    needs: preview-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.13.1', '24.x']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: setup supported consumer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: download no-root-install npm candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wharfie-preview-npm-candidate
          path: ${{ runner.temp }}/wharfie-preview-candidate
      - name: install candidate and run the complete magnetic demo
        run: >-
          node ./scripts/verify-preview-consumer.js
          --candidate-tarball
          "$RUNNER_TEMP/wharfie-preview-candidate/wharfie-wharfie-$(node --print "require('./package.json').version").tgz"
