name: Wharfie CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
      - name: install pinned npm
        # setup-node's npm cache probe runs before this step. The Node
        # distribution's bundled npm is intentionally rejected by the exact
        # devEngines pin, so bootstrap from outside the repository first.
        working-directory: ${{ runner.temp }}
        run: npm install --global "$(node --print "require('${GITHUB_WORKSPACE}/package.json').packageManager")"
      - run: npm ci
      - run: npm run test:ci
      - name: verify packed install and real Linux SEA
        # Keep portability evidence visible when another validation gate fails.
        if: ${{ always() }}
        run: npm run verify:package:sea
