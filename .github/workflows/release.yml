name: Wharfie Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: npm
      - name: install pinned npm
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run test:ci
      - name: verify v2 release readiness
        run: npm run verify:release-ready
      - name: verify release tag and npm availability
        run: |
          npm run verify:release-version
          npm run verify:release-unpublished
        env:
          WHARFIE_RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: verify packed install and real generated-app Linux SEA
        run: npm run verify:package:sea

  release_npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: install pinned npm
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - run: npm ci
      - name: publish stable npm package
        if: github.event.release.prerelease == false
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      - name: publish prerelease npm package
        if: github.event.release.prerelease == true
        run: npm publish --tag next --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
