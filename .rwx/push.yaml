on:
  github:
    push:
      init:
        commit-sha: ${{ event.git.sha }}
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  - key: code
    call: git/clone 2.0.3
    with:
      repository: https://github.com/wharfie/wharfie.git
      ref: ${{ init.commit-sha }}

  - key: node
    call: nodejs/install 1.1.12
    use: code
    with:
      node-version-file: .nvmrc
    filter:
      - .nvmrc

  - key: npm
    use: [code, node]
    run: |
      package_manager="$(node --print "require('./package.json').packageManager")"
      cd /tmp
      npm install --global "$package_manager"
      npm --version
    filter:
      - package.json

  - key: npm-install
    use: [code, npm]
    run: npm ci
    filter:
      - package.json
      - package-lock.json

  - key: lint
    use: npm-install
    run: npm run lint

  - key: test
    use: npm-install
    timeout: 30m
    # OverlayFS can report different devices for a directory and its files.
    # Keep only the small, non-executing service fixtures on single-device tmpfs.
    run: |
      set -e
      node --input-type=module <<'NODE'
      import fs from 'node:fs';
      import path from 'node:path';
      const root = fs.mkdtempSync('/dev/shm/wharfie-service-fixture-');
      try {
        const file = path.join(root, 'probe');
        fs.writeFileSync(file, 'probe', { mode: 0o600 });
        if (fs.lstatSync(root).dev !== fs.lstatSync(file).dev) {
          throw new Error('Service fixtures require matching directory and file devices.');
        }
        const { bavail, bsize } = fs.statfsSync(root);
        console.log(`Service fixture filesystem verified; ${bavail * bsize} bytes available.`);
      } finally {
        fs.rmSync(root, { recursive: true, force: true });
      }
      NODE
      WHARFIE_SERVICE_TEST_TMPDIR=/dev/shm npm run test

  - key: typecheck
    use: npm-install
    run: npm run typecheck
