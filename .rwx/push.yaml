on:
  github:
    push:
      init:
        commit-sha: ${{ event.git.sha }}
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  - key: code
    call: git/clone 2.0.3
    with:
      repository: https://github.com/wharfie/wharfie.git
      ref: ${{ init.commit-sha }}

  - key: node
    call: nodejs/install 1.1.12
    use: code
    with:
      node-version-file: .nvmrc
    filter:
      - .nvmrc

  - key: npm
    use: [code, node]
    run: |
      package_manager="$(node --print "require('./package.json').packageManager")"
      cd /tmp
      npm install --global "$package_manager"
      npm --version
    filter:
      - package.json

  - key: npm-install
    use: [code, npm]
    run: npm ci
    filter:
      - package.json
      - package-lock.json

  - key: lint
    use: npm-install
    run: npm run lint

  - key: test
    use: npm-install
    timeout: 30m
    run: npm run test

  - key: typecheck
    use: npm-install
    run: npm run typecheck
